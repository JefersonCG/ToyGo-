name: ToyGo Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm test

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run O_Batedor in DryRun
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\o_batedor.ps1 -Modo COMPLIANCE -InstallerPhase audit

      - name: Prepare verified MariaDB payload
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\mariadb\prepare-embedded.ps1

      - name: Build installer package
        run: npm --workspace @toygo/installer run build

      - name: Build Desktop
        run: npm run build --workspace @toygo/desktop

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml --win nsis

      - name: Install NSIS artifact in an isolated directory
        shell: powershell
        run: |
          $setup = Get-ChildItem -LiteralPath .\release -Filter 'ToyGo-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer nao encontrado.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'toygo-installed'
          Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$installRoot" -Wait
          $desktop = Join-Path $installRoot 'ToyGo!.exe'
          if (-not (Test-Path -LiteralPath $desktop -PathType Leaf)) { throw "Desktop instalado nao encontrado: $desktop" }
          "TOYGO_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap MariaDB from the installed Desktop
        shell: powershell
        run: |
          $desktop = Join-Path $env:TOYGO_INSTALL_ROOT 'ToyGo!.exe'
          $dataDir = Join-Path $env:RUNNER_TEMP 'toygo-mariadb-data'
          $env:TOYGO_MARIADB_ROOT_PASSWORD = 'ci-root-password'
          $env:TOYGO_DESKTOP_MARIADB_PASSWORD = 'ci-app-password'
          $env:TOYGO_DESKTOP_MARIADB_DATABASE = 'toygo_ci'
          $env:TOYGO_DESKTOP_MARIADB_USER = 'toygo_ci'
          $env:TOYGO_MARIADB_DATA_DIR = $dataDir
          $process = Start-Process -FilePath $desktop -ArgumentList '--toygo-provision' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Bootstrap MariaDB falhou com codigo $($process.ExitCode)." }
          $service = Get-Service -Name ToyGoMariaDB -ErrorAction Stop
          if ($service.Status -ne 'Running') { throw "Servico ToyGoMariaDB nao esta ativo: $($service.Status)" }

      - name: Verify packaged resources
        shell: powershell
        run: |
          $resources = Join-Path $env:TOYGO_INSTALL_ROOT 'resources'
          $required = @(
            (Join-Path $resources 'mariadb\11.8\bin\mariadbd.exe'),
            (Join-Path $resources 'mariadb\11.8\bin\mariadb-install-db.exe'),
            (Join-Path $resources 'installer\o_batedor.ps1'),
            (Join-Path $resources 'installer\provision-toygo.ps1')
          )
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Recurso ausente: $path" } }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: toygo-windows-installer
          path: release/ToyGo-Setup-*.exe
          if-no-files-found: error
